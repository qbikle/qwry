[package]
name = "qwry"
version = "0.9.7-alpha.2"
description = "Fast, keyboard-first PostgreSQL client for macOS"
authors = ["Manish Gudewar"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qwry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }
tokio-postgres = "0.7.17"
rustls = "0.23.40"
tokio-postgres-rustls = "0.14.0"
thiserror = "2.0.18"
async-trait = "0.1.89"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
futures-util = "0.3.32"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
objc2 = "0.6.4"
csv = "1.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# ---- agent (AGENT-SPEC; deps decided in W0, DECISIONS 2026-09-05) ----------
# AST gate (§8.1): libpg_query 17, the grammar the server itself parses, so a
# legal query is never falsely rejected. Build needs libclang (bindgen).
pg_query = "6.2.0"
# provider HTTP relay (agent_http.rs). reqwest is already in the tree through
# tauri-plugin-updater on rustls; `stream` + `json` add no second TLS stack.
reqwest = { version = "0.13.4", features = ["stream", "json"] }
# in-process streamable-HTTP MCP server for the `claude -p` provider
# (agent_mcp.rs): rmcp's tower Service on bare hyper via TowerToHyperService,
# no axum. Versions match the W0 spike that compiled and served `initialize`.
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
tokio-util = "0.7"
# SIGTERM-then-SIGKILL on the `claude -p` child (agent_claude.rs): tokio's
# Child::kill is SIGKILL only, and a CLI killed outright never flushes.
libc = "0.2"
# hyper request/response plumbing around rmcp's tower Service (agent_mcp.rs):
# the 401/403 gate must build the same body type rmcp's service returns.
http = "1"
http-body-util = "0.1"
bytes = "1"
